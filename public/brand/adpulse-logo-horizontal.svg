<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <defs>
    <linearGradient id="adpulse-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#100030" />
      <stop offset="45%" stop-color="#630044" />
      <stop offset="100%" stop-color="#EF0B80" />
    </linearGradient>
    <linearGradient id="spark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF0B80" />
      <stop offset="100%" stop-color="#FB0C85" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Pulse Hexagon Emblem -->
  <g transform="translate(4, 6)">
    <rect width="48" height="48" rx="14" fill="url(#adpulse-grad)" />
    <!-- Pulse Wave Symbol -->
    <path d="M12 24 L18 24 L22 14 L27 34 L32 20 L35 24 L40 24" 
          stroke="url(#spark-grad)" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
    <!-- Center energetic dot -->
    <circle cx="27" cy="34" r="2.5" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <text x="64" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#FFFFFF" class="logo-text-main">Ad</tspan>
    <tspan fill="url(#spark-grad)">Pulse</tspan>
  </text>
  <text x="65" y="47" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="3.5" fill="#EF0B80">
    MEDIA
  </text>
</svg>
